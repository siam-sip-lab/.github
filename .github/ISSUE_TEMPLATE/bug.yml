name: Bug report
description: Something does not work as expected
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Clear steps make the fix faster.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include error messages or screenshots.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or abc1234
