# Reusable CI for Python repositories in siam-sip-lab.
# Call it from a repository with:
#   jobs:
#     python:
#       uses: siam-sip-lab/.github/.github/workflows/python-ci.yml@main
name: python-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[dev]"
      - name: Test
        run: pytest
